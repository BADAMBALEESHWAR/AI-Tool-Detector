# Production backend on the EC2 host behind api.tooldetect.in.
#
#   CloudFront (HTTPS) → host nginx :80 → 127.0.0.1:3001 (this container) → Amazon RDS
#
# The dashboards are static sites on S3 + CloudFront and are not part of this file.
# Lives in /opt/ai-monitor on the server next to its .env (DATABASE_URL, JWT
# secrets, FRONTEND_URL / ADMIN_URL / STUDENT_URL, ECR_REGISTRY). The deploy
# workflow uploads this file and runs:
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml up -d
# See DEPLOYMENT.md.
name: ai-monitor

services:
  backend:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY in .env}/ai-monitor-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Two proxies in front of the API: CloudFront and the host nginx.
      TRUST_PROXY: "2"
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      # Only nginx on the host can reach the API directly.
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./downloads:/app/downloads:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
