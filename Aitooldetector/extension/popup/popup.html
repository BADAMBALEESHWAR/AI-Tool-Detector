<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Monitor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      background: #09090b;
      color: #f4f4f5;
      font-family: Inter, system-ui, sans-serif;
      font-size: 13px;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo-text h1 {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .logo-text p {
      font-size: 10px;
      color: #71717a;
    }

    .status-bar {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.08);
      border-bottom: 1px solid rgba(16, 185, 129, 0.15);
    }

    .status-bar.inactive {
      background: rgba(255, 255, 255, 0.03);
      border-bottom-color: rgba(255, 255, 255, 0.06);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .dot.inactive {
      background: #52525b;
    }

    .status-text {
      font-size: 11px;
      color: #34d399;
    }

    .status-text.inactive {
      color: #71717a;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #52525b;
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .row-label {
      color: #71717a;
      font-size: 11px;
    }

    .row-value {
      color: #e4e4e7;
      font-size: 11px;
      font-weight: 500;
    }

    .footer {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer a {
      font-size: 10px;
      color: #7c3aed;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .version {
      font-size: 10px;
      color: #3f3f46;
    }

    .setup-msg {
      padding: 16px;
      text-align: center;
      color: #71717a;
      font-size: 11px;
      line-height: 1.5;
    }

    .setup-msg a {
      color: #7c3aed;
    }

    .signin-form {
      padding: 16px;
    }

    .signin-form label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #71717a;
      margin-bottom: 4px;
      margin-top: 10px;
    }

    .signin-form label:first-child {
      margin-top: 0;
    }

    .signin-form input {
      width: 100%;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f4f4f5;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .signin-form input:focus {
      border-color: #7c3aed;
    }

    .signin-form button {
      width: 100%;
      margin-top: 14px;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .signin-form button:hover {
      background: #6d28d9;
    }

    .signin-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .signin-error {
      color: #f87171;
      font-size: 11px;
      margin-top: 8px;
      display: none;
    }

    .signin-hint {
      font-size: 10px;
      color: #52525b;
      margin-top: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">🤖</div>
    <div class="logo-text">
      <h1>AI Monitor</h1>
      <p>Usage Tracker Extension</p>
    </div>
  </div>

  <div id="status-bar" class="status-bar inactive">
    <div id="status-dot" class="dot inactive"></div>
    <span id="status-text" class="status-text inactive">Loading...</span>
  </div>

  <div id="content">
    <div class="setup-msg">
      <p>Loading extension status...</p>
    </div>
  </div>

  <div class="footer">
    <a href="http://localhost:5173/dashboard" target="_blank">Open Student Portal</a>
    <span class="version">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>

</html>
