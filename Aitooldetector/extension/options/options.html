<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Monitor — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 380px;
      padding: 20px;
      color: #1f2937;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.sub { font-size: 12px; color: #6b7280; margin: 0 0 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #status { font-size: 12px; margin-top: 10px; color: #16a34a; }
  </style>
</head>
<body>
  <h1>AI Monitor — Backend Settings</h1>
  <p class="sub">Set the backend API URL. This is normally written automatically by the desktop app, but you can override it here (e.g., for institutions deploying to a custom domain).</p>
  <label for="apiBase">Backend API URL</label>
  <input id="apiBase" type="text" placeholder="https://api.yourinstitution.edu/api" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
