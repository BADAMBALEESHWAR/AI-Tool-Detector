# Local / development stack: builds every image from source.
#   cp .env.example .env   (then fill in the secrets)
#   docker compose up --build
# Student portal http://localhost:5173 · Admin http://localhost:5174 · API http://localhost:3001
name: ai-monitor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ai-monitor-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_monitor}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${STUDENT_URL:-http://localhost:5173}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5174}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - uploads:/app/uploads
      # Installers (.exe / .zip) are not in git; drop them into backend/downloads.
      - ./backend/downloads:/app/downloads:ro
    ports:
      - "3001:3001"

  student:
    build:
      context: ./student-dashboard
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3001}/api
        VITE_SOCKET_URL: ${API_URL:-http://localhost:3001}
    image: ai-monitor-student:local
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "5173:80"

  admin:
    build:
      context: ./admin-dashboard
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3001}/api
        VITE_SOCKET_URL: ${API_URL:-http://localhost:3001}
    image: ai-monitor-admin:local
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "5174:80"

volumes:
  pgdata:
  uploads:
