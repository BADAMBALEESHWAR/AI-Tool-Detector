# Builds the three images, pushes them to Amazon ECR and rolls them out on the
# EC2 host with docker compose. One-time AWS / GitHub setup: Aitooldetector/DEPLOYMENT.md
#
# Repository variables: AWS_REGION, API_URL (e.g. https://api.example.edu), optional DEPLOY_PATH
# Repository secrets:   AWS_ROLE_ARN  (or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY),
#                       EC2_HOST, EC2_USER, EC2_SSH_KEY
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC role assumption
  contents: read

jobs:
  images:
    name: Push ${{ matrix.image }}
    # Skipped until the AWS variables are configured, so pushes don't fail before setup.
    if: vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            image: ai-monitor-backend
          - app: admin-dashboard
            image: ai-monitor-admin
          - app: student-dashboard
            image: ai-monitor-student
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: Aitooldetector/${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:latest
          # Only the dashboards use these; Vite bakes them into the bundle.
          build-args: |
            VITE_API_URL=${{ vars.API_URL }}/api
            VITE_SOCKET_URL=${{ vars.API_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to EC2
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ai-monitor' }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: Aitooldetector/docker-compose.prod.yml,Aitooldetector/deploy/Caddyfile
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull and restart containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,AWS_REGION,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            ECR_REGISTRY=$(grep '^ECR_REGISTRY=' .env | cut -d= -f2-)
            # Uses the instance profile (AmazonEC2ContainerRegistryReadOnly).
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
