name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            check: npx prisma generate && npm test && npm run build
          - app: admin-dashboard
            check: npm run build
          - app: student-dashboard
            check: npm run build
          - app: desktop-app
            check: npm run typecheck && npm test && npx electron-vite build
    defaults:
      run:
        working-directory: Aitooldetector/${{ matrix.app }}
    env:
      # The desktop app's tests and build do not need the Electron binary itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Aitooldetector/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.check }}

  docker:
    name: Docker image ${{ matrix.app }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, admin-dashboard, student-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: Aitooldetector/${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
